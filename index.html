<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本の歴史年表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>日本の歴史年表</h1>

  <table>
    <thead>
      <tr>
        <th>年代</th>
        <th>出来事</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>593年</td>
        <td>聖徳太子が政治を行う</td>
      </tr>
      <tr>
        <td>710年</td>
        <td>平城京に都が移される</td>
      </tr>
      <tr>
        <td>794年</td>
        <td>平安京に都が移される</td>
      </tr>
      <tr>
        <td>1192年</td>
        <td>源頼朝が征夷大将軍になる</td>
      </tr>
      <tr>
        <td>1603年</td>
        <td>徳川家康が江戸幕府を開く</td>
      </tr>
      <tr>
        <td>1868年</td>
        <td>明治時代が始まる</td>
      </tr>
      <tr>
        <td>1945年</td>
        <td>第二次世界大戦が終わる</td>
      </tr>
      <tr>
        <td>1964年</td>
        <td>東京オリンピックが開催される</td>
      </tr>
      <tr>
        <td>2000年</td>
        <td>シドニーオリンピックが開催される</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
